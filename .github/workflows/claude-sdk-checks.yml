name: Claude Agent SDK adapter

on:
  pull_request:
    paths:
      - "open-sse/executors/**"
      - "open-sse/translator/**"
      - "src/shared/constants/providers.js"
      - "src/sse/services/auth.js"
      - "src/app/api/v1/models/route.js"
      - "src/app/api/cli-tools/claude-sdk/**"
      - "src/shared/components/ClaudeSdkStatusCard.js"
      - "src/shared/components/NoAuthProxyCard.js"
      - "tests/unit/claude-sdk.test.js"
      - "tests/unit/claude-sdk-tools.test.js"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/claude-sdk-checks.yml"
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install test runner in isolated directory
        run: |
          mkdir -p /tmp/9router-vitest
          cd /tmp/9router-vitest
          printf '{"name":"9router-vitest","private":true,"type":"module","version":"1.0.0"}' > package.json
          yarn add --non-interactive --no-lockfile --dev vitest@^4.0.0
          ln -s /tmp/9router-vitest/node_modules/vitest "$GITHUB_WORKSPACE/node_modules/vitest"
      - name: SDK adapter offline tests
        run: /tmp/9router-vitest/node_modules/.bin/vitest run tests/unit/claude-sdk.test.js tests/unit/claude-sdk-tools.test.js --reporter=verbose
      - name: Existing Claude request translator tests
        run: /tmp/9router-vitest/node_modules/.bin/vitest run tests/unit/openai-to-claude.test.js --reporter=verbose
      - name: Build Next.js standalone server
        run: npm run build
